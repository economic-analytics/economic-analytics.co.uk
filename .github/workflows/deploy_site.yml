on:
  push:
  workflow_dispatch:
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy site
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Checkout repository
      uses: actions/checkout@v4
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.EA_FTP_SERVER }}
        username: ${{ secrets.EA_FTP_USERNAME }}
        password: ${{ secrets.EA_FTP_PASSWORD }}
        local-dir: _site/
        server-dir: public_html/
    
    # - name: 📂 Sync Files (SFTP)
    #   uses: SamKirkland/web-deploy@v1
    #   with:
    #     target-server: ${{ secrets.EA_SFTP_SERVER }}
    #     remote-user: ${{ secrets.EA_SFTP_USERNAME }}
    #     private-ssh-key: ${{ secrets.EA_SFTP_SSH }}
    #     source-path: ./_site/
    #     destination-path: /opt/sites/economic-analytics.co.uk/

    - name: FTP/SFTP file deployer
      uses: milanmk/actions-file-deployer@1.16
      with:
        remote-protocol: sftp
        sync: full
        remote-host: ${{ secrets.EA_SFTP_SERVER }}
        remote-user: ${{ secrets.EA_SFTP_USERNAME }}
        ssh-private-key: ${{ secrets.EA_SFTP_SSH }}
        local-path: ./_site/
        remote-path: /opt/sites/economic-analytics.co.uk/
        
 
